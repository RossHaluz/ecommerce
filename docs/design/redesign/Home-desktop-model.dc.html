<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Вибір моделі — комп'ютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <header style="height: 72px; background: #484848; display: flex; align-items: center; gap: 14px; padding: 0 64px">
    <span style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></span>
    <span style="color: #FFFFFF; font-weight: 800; font-size: 20px; letter-spacing: 0.08em">AUDIPARTS</span>
    <div style="flex: 1; height: 44px; border-radius: 8px; background: #FFFFFF"></div>
    <span style="height: 44px; padding: 0 14px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-weight: 800; display: flex; align-items: center">Підбір за VIN</span>
    <span style="color: #FFFFFF; font-weight: 700">+38 (067) 383 42 83</span>
  </header>

  <div style="display: flex; gap: 24px; padding: 20px 64px 0">
    <div style="width: 290px; height: 780px; border-radius: 12px; background: #FFFFFF; flex: none"></div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 10px; background: #2E2E2E; color: #FFFFFF; font-weight: 800; box-shadow: 0 0 0 3px #F6B8C2">
          Оберіть модель Audi
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
        </span>
        <span style="height: 44px; width: 330px; border-radius: 10px; background: #FFFFFF"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; opacity: 0.55">
        <img src="/_blob/40297259a343bbf265474c29f9816d75" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px">
        <img src="/_blob/f83dbeab6ac3a60c6257dbcefceffa63" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px">
        <img src="/_blob/46601fbc7f4f6bbf8952a7364da3e182" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px">
        <img src="/_blob/42847a56d3b6a3b366369abfa906b4da" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 10px">
      </div>
    </div>
  </div>

  <section role="dialog" aria-label="Оберіть модель Audi" style="position: absolute; left: 378px; top: 150px; width: 680px; background: #FFFFFF; border-radius: 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.22); display: flex; flex-direction: column; overflow: hidden">
    <div style="padding: 16px; border-bottom: 1px solid #EEEEEE">
      <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 10px; border: 2px solid #484848">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input aria-label="Знайти модель" placeholder="Знайти модель, напр. Q7 4M" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent">
      </label>
    </div>
    <div style="display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 440px">
      <ul style="list-style: none; margin: 0; padding: 8px; border-right: 1px solid #EEEEEE; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{series}}" as="s" hint-placeholder-count="16">
          <li><a href="#" style="{{s.style}}">{{s.name}}<sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><span aria-hidden="true">›</span></sc-if></a></li>
        </sc-for>
      </ul>
      <div style="padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0 0 4px; font-size: 18px; font-weight: 800; color: #2E2E2E">Audi Q8 — оберіть покоління</h2>
        <sc-for list="{{gens}}" as="g" hint-placeholder-count="3">
          <a href="Home-desktop-filtered.dc.html" style="{{g.style}}">
            <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px">{{g.name}}</b><span style="font-size: 14px; opacity: 0.8">{{g.years}}</span></span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
          </a>
        </sc-for>
        <a href="Home-desktop-filtered.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; border: 1px solid #CFCFCF; color: #2E2E2E; font-weight: 700">Усі Audi Q8 — будь-яке покоління</a>
        <p style="margin: auto 0 0; font-size: 13px; line-height: 19px; color: #6B6B6B">Запам’ятаємо вибір: каталог і пошук одразу показуватимуть деталі для вашої машини.</p>
      </div>
    </div>
    <div style="padding: 12px 16px; border-top: 1px solid #EEEEEE; display: flex; align-items: center; justify-content: space-between; font-size: 14px">
      <span>Не знаєте покоління?</span>
      <a href="#" style="color: #C0092A; font-weight: 800">Підбір за VIN-кодом →</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const row = 'display: flex; align-items: center; justify-content: space-between; min-height: 36px; padding: 0 12px; border-radius: 8px; font-size: 15px; ';
    const names = ['A1', 'A3', 'A4', 'A5', 'A6', 'A7', 'A8', 'Q2', 'Q3', 'Q4 e-tron', 'Q5', 'Q7', 'Q8', 'e-tron', 'e-tron GT', 'Інші марки'];
    const gen = 'display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px; border-radius: 10px; ';
    return {
      series: names.map((name) => ({ name, on: name === 'Q8', style: row + (name === 'Q8' ? 'background: #2E2E2E; color: #FFFFFF; font-weight: 800' : 'color: #2E2E2E; font-weight: 600') })),
      gens: [
        { name: 'Q8', years: '2018–2023', style: gen + 'background: #C0092A; color: #FFFFFF' },
        { name: 'Q8', years: '2024 і новіші', style: gen + 'background: #F2F2F2; color: #2E2E2E' },
        { name: 'Q8 e-tron', years: '2024', style: gen + 'background: #F2F2F2; color: #2E2E2E' }
      ]
    };
  }
}
</script>
</body>
</html>
