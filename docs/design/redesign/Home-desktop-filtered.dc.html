<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Головна з фільтрами — комп'ютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="min-height: 1300px; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <header style="background: #484848">
    <div style="max-width: 1360px; margin: 0 auto; padding: 0 24px; min-height: 72px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; box-sizing: border-box">
      <a href="#" aria-label="Меню" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>
      <span style="color: #FFFFFF; font-weight: 800; font-size: 20px; letter-spacing: 0.08em">AUDIPARTS</span>
      <label style="flex: 1 1 320px; display: flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 8px; background: #FFFFFF; gap: 10px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input aria-label="Пошук" placeholder="Пошук серед деталей для Q8" style="border: 0; outline: none; flex: 1; min-width: 0; font: inherit; font-size: 15px; background: transparent">
      </label>
      <a href="#" style="height: 44px; padding: 0 14px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-weight: 800; display: flex; align-items: center">Підбір за VIN</a>
      <a href="#" style="color: #FFFFFF; font-weight: 700">+38 (067) 383 42 83</a>
      <a href="#" aria-label="Кошик" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"></path><circle cx="9" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg></a>
    </div>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; padding: 20px 24px 64px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
    <aside style="flex: 0 1 290px; min-width: 250px">
      <nav aria-label="Категорії" style="background: #FFFFFF; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="10">
          <div style="display: flex; flex-direction: column">
            <a href="#" style="{{c.style}}"><span style="flex: 1">{{c.name}}</span><span style="font-size: 13px; font-weight: 600; opacity: 0.7">{{c.n}}</span></a>
            <sc-if value="{{c.open}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-direction: column; gap: 2px; padding: 4px 0 6px 14px">
                <sc-for list="{{c.subs}}" as="s" hint-placeholder-count="4">
                  <a href="#" style="{{s.style}}">{{s.name}}</a>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </nav>
    </aside>

    <section style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
        <a href="Home-desktop-model.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 14px; border-radius: 10px; background: #C0092A; color: #FFFFFF; font-weight: 800">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v4H3z"></path></svg>
          Audi Q8 (2018–2023)
          <span aria-label="Прибрати модель" style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 18px">×</span>
        </a>
        <div role="group" aria-label="Наявність" style="display: flex; height: 44px; border-radius: 10px; background: #FFFFFF; padding: 4px; box-sizing: border-box; gap: 4px">
          <button style="padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #484848; font: inherit; font-weight: 600">Усі</button>
          <button style="padding: 0 14px; border: 0; border-radius: 7px; background: #2E2E2E; color: #FFFFFF; font: inherit; font-weight: 800">В наявності</button>
          <button style="padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: #484848; font: inherit; font-weight: 600">Під замовлення</button>
        </div>
        <label style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 14px">Сортування
          <select style="height: 44px; padding: 0 10px; border: 1px solid #CFCFCF; border-radius: 10px; font: inherit; background: #FFFFFF"><option>Спершу дорожчі</option><option>Спершу дешевші</option></select>
        </label>
      </div>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px">
        <span style="color: #6B6B6B">Обрано:</span>
        <sc-for list="{{active}}" as="a" hint-placeholder-count="3">
          <span style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 6px 0 12px; border-radius: 17px; background: #FFFFFF; border: 1px solid #DDDDDD; color: #2E2E2E; font-weight: 700">{{a}}<button aria-label="Прибрати фільтр" style="width: 26px; height: 26px; border: 0; border-radius: 50%; background: #F2F2F2; color: #484848; font-size: 15px">×</button></span>
        </sc-for>
        <button style="height: 34px; padding: 0 8px; border: 0; background: none; color: #C0092A; font: inherit; font-weight: 800; text-decoration: underline">Скинути все</button>
      </div>

      <h1 style="margin: 0; font-size: 24px; font-weight: 800; color: #2E2E2E">Фари передні Audi Q8 (2018–2023) <span style="font-size: 16px; font-weight: 600; color: #6B6B6B">· 4 товари</span></h1>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px">
        <sc-for list="{{cards}}" as="it" hint-placeholder-count="4">
          <dc-import name="Card" item="{{it}}" hint-size="100%,360px"></dc-import>
        </sc-for>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { stock: 'В наявності', stockColor: '#1E7B3C', model: 'Audi Q8 (2018–2023)' };
    const row = 'display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 10px; border-radius: 8px; font-size: 15px; ';
    const sub = 'display: flex; align-items: center; min-height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14px; ';
    const subs = ['Уся оптика', 'Фари передні', 'Ліхтарі задні', 'Комплектуючі до фар'].map((name) => ({
      name, style: sub + (name === 'Фари передні' ? 'background: #2E2E2E; color: #FFFFFF; font-weight: 800' : 'color: #2E2E2E; font-weight: 600')
    }));
    const c = (name, open) => ({ name, open, n: '[N]', subs: open ? subs : [], style: row + (open ? 'color: #C0092A; font-weight: 800' : 'color: #2E2E2E; font-weight: 600') });
    return {
      cats: [c('Усі запчастини'), c('Кузовні частини'), c('Оптика', true), c('Інтер’єр салону'), c('Електроніка'), c('Система охолодження двигуна'), c('Кондиціонування, опалення'), c('Двигун + АКПП'), c('Ходова й рульове'), c('Інше')],
      active: ['Audi Q8 (2018–2023)', 'Фари передні', 'В наявності'],
      cards: [
        { ...ok, img: '/_blob/40297259a343bbf265474c29f9816d75', title: 'Комплект фар Matrix Q8', oe: '4M8941035', price: '$3 600' },
        { ...ok, img: '/_blob/d46bd7087aa27aec7a252fbced241423', title: 'Фара ліва Matrix Q8 USA', oe: '4M8941035B', price: '$1 800' },
        { ...ok, img: '/_blob/d76dce9adcbd1d9c81947d2c3df4eb63', title: 'Фара права Matrix Q8 USA', oe: '4M8941036B', price: '$1 800' },
        { ...ok, img: '/_blob/c12df1f0084ed70736f564ba4f2262df', title: 'Фара права Full LED Q8', oe: '4M8941034', price: '$1 000' }
      ]
    };
  }
}
</script>
</body>
</html>
