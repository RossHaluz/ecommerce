<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">

body{margin:0}

</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #2A2A2A; font-family: 'Mulish', sans-serif; color: #484848">
  <form role="dialog" aria-label="Фільтри" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; margin: 0; background: #FFFFFF; border-radius: 16px 16px 0 0; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D0D0D0"></div>
    <div style="display: flex; align-items: center">
      <h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 800; color: #2E2E2E">Фільтри</h2>
      <button type="button" style="height: 44px; padding: 0 4px; border: 0; background: none; color: #6B6B6B; font: inherit; font-size: 14px; font-weight: 700; text-decoration: underline">Скинути</button>
    </div>

    <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0 0 8px; font-size: 15px; font-weight: 800; color: #2E2E2E">Модель</legend>
      <a href="ModelPicker-mobile.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; border-radius: 10px; background: #F2F2F2; color: #2E2E2E; font-weight: 700">Audi Q8 (2018–2023)<span style="color: #C0092A; font-weight: 800">Змінити</span></a>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0 0 8px; font-size: 15px; font-weight: 800; color: #2E2E2E">Наявність</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <label style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #F2F2F2; font-size: 14px; font-weight: 700"><input type="radio" name="stock" style="position: absolute; opacity: 0">Усі</label>
        <label style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #2E2E2E; color: #FFFFFF; font-size: 14px; font-weight: 800"><input type="radio" name="stock" checked style="position: absolute; opacity: 0">В наявності</label>
        <label style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #F2F2F2; font-size: 14px; font-weight: 700; text-align: center"><input type="radio" name="stock" style="position: absolute; opacity: 0">Під замовлення</label>
      </div>
    </fieldset>

    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0 0 8px; font-size: 15px; font-weight: 800; color: #2E2E2E">Сортування</legend>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px"><input type="radio" name="sort" checked style="width: 20px; height: 20px; accent-color: #C0092A">Спершу дорожчі</label>
        <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px"><input type="radio" name="sort" style="width: 20px; height: 20px; accent-color: #C0092A">Спершу дешевші</label>
      </div>
    </fieldset>

    <a href="Category-mobile.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-size: 17px; font-weight: 800">Показати 4 товари</a>
  </form>
</div>
</x-dc>
