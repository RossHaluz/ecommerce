<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Картка товару в списку</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<article style="width: 100%; height: 100%; box-sizing: border-box; background: #FFFFFF; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; font-family: 'Mulish', sans-serif; color: #484848">
  <img src="{{c.img}}" alt="" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block">
  <h3 style="margin: 0; font-size: 14px; line-height: 18px; font-weight: 700; color: #2E2E2E; height: 36px; overflow: hidden">{{c.title}}</h3>
  <span style="font-size: 12px; line-height: 16px; font-weight: 700; color: #484848">{{c.model}}</span>
  <span style="font-size: 12px; color: #6B6B6B">{{c.oe}}</span>
  <span style="font-size: 12px; font-weight: 700; color: {{c.stockColor}}">{{c.stock}}</span>
  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 6px">
    <span style="font-size: 17px; font-weight: 800; color: #C0092A">{{c.price}}</span>
    <button aria-label="Додати в кошик" style="width: 44px; height: 40px; border: 0; border-radius: 8px; background: #C0092A; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2"></path><circle cx="9" cy="20" r="1.3"></circle><circle cx="17" cy="20" r="1.3"></circle></svg>
    </button>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":175,"height":340}}'>
class Component extends DCLogic {
  renderVals() {
    const c = this.props.item ?? {
      img: '/_blob/40297259a343bbf265474c29f9816d75',
      title: 'Комплект фар Matrix Q8',
      model: 'Audi Q8 (2018–2023)',
      oe: '4M8941035',
      stock: 'В наявності',
      stockColor: '#1E7B3C',
      price: '$3 600'
    };
    return { c };
  }
}
</script>
</body>
</html>
