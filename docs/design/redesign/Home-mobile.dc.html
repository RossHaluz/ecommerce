<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Головна — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 2700px; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">

  <header style="background: #484848; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 8px">

      </a>
    </div>
    <a href="Search-suggest.dc.html" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 10px; background: #FFFFFF; color: #8A8A8A; font-size: 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      Назва деталі або OE-номер
    </a>
  </header>

  <div style="position: relative; background: #FFFFFF; padding: 12px 0 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06)">
    <div style="display: flex; gap: 8px; padding: 0 12px">
      <a href="ModelPicker-mobile.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 10px; background: #2E2E2E; color: #FFFFFF; font-size: 14px; font-weight: 800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v4H3z"></path></svg>
        <span style="flex: 1">Оберіть модель Audi</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>

      <a href="Home-filters.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFCF; color: #2E2E2E; font-size: 14px; font-weight: 800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        Фільтри
      </a>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 12px; overflow: hidden">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <a href="Category-mobile.dc.html" style="{{c.style}}">{{c.name}}</a>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 12px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px">
      <h1 style="margin: 0; font-size: 18px; font-weight: 800; color: #2E2E2E">Запчастини Audi <span style="font-size: 14px; font-weight: 600; color: #6B6B6B">· [кількість] товарів</span></h1>
      <a href="#" style="display: flex; align-items: center; gap: 4px; min-height: 44px; color: #2E2E2E; font-weight: 700">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>
        Дорожчі
      </a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cards}}" as="it" hint-placeholder-count="6">
        <dc-import name="Card" item="{{it}}" hint-size="100%,330px"></dc-import>
      </sc-for>
    </div>

    <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 10px; background: #FFFFFF; color: #2E2E2E; font-size: 14px; line-height: 19px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C0092A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 10h4M7 14h7"></path></svg>
      <span>Не знаєте модель? <b style="color: #C0092A">Підбір за VIN-кодом</b></span>
    </a>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cards2}}" as="it" hint-placeholder-count="2">
        <dc-import name="Card" item="{{it}}" hint-size="100%,330px"></dc-import>
      </sc-for>
    </div>
    <span style="text-align: center; font-size: 13px; color: #6B6B6B">Наступні товари підвантажуються під час прокрутки</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="TabBar" active="home" cart-count="{{one}}" hint-size="390px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2700}}'>

    const ok = { stock: 'В наявності', stockColor: '#1E7B3C' };
    const chip = 'flex: none; display: flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; ';
    const names = ['Усі', 'Кузовні частини', 'Оптика', 'Інтер’єр салону', 'Електроніка', 'Охолодження'];
    return {
      one: 1,
      cats: names.map((name, i) => ({ name, style: chip + (i === 0 ? 'background: #C0092A; color: #FFFFFF; font-weight: 800' : 'background: #F2F2F2; color: #2E2E2E; font-weight: 700') })),
      cards: [
        { ...ok, img: '/_blob/40297259a343bbf265474c29f9816d75', title: 'Комплект фар Matrix Q8', model: 'Audi Q8 (2018–2023)', oe: '4M8941035', price: '$3 600' },

        { ...ok, img: '/_blob/77e4a077d44e91ae5f5a1398a8bc688d', title: 'Комплект фар A8 D5 Matrix рест', model: 'Audi A8 D5 (2023+)', oe: '4N0941036C', price: '$3 000' },
        { ...ok, img: '/_blob/7c22de5146e0e1f4f72463611f512573', title: 'Установочна панель в зборі Q7 4M 4,0', model: 'Audi Q7 4M (2020–2024)', oe: '4M0805594D', price: '$2 800' }
      ],
      cards2: [
        { ...ok, img: '/_blob/39c89a3829c0c318faacb2f10d42f147', title: 'Блок двигуна', model: 'Audi Q7 4M (2020–2024)', oe: '059011GS', price: '$2 500' },
        { ...ok, img: '/_blob/5d8b1a5db749d36d584ef3b70ee5070a', title: 'Салон 7 місць Q7 4M, шкіра/алькантара', model: '', oe: '4M0', price: '$2 300' }
      ]
    };
  }
}
</script>
</body>
</html>
