      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 60px; color: #2E2E2E">

          </span>
          <span style="font-size: 15px; font-weight: 800; color: #C0092A">{{it.price}}</span>
        </a>
      </sc-for>
    </section>

    <a href="Search-results.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-weight: 800">Усі результати для «фара q8»</a>
