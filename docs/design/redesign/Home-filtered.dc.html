<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Головна з обраною моделлю — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1500px; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <header style="background: #484848; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <span style="color: #FFFFFF; font-weight: 800; font-size: 18px; letter-spacing: 0.08em; padding-left: 4px">AUDIPARTS</span>
      <a href="#" aria-label="Подзвонити" style="width: 44px; height: 44px; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h3.5l1.7 4.2-2.2 1.4a11 11 0 0 0 6.4 6.4l1.4-2.2L20 15.5V19a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"></path></svg></a>
    </div>
    <a href="Search-suggest.dc.html" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 10px; background: #FFFFFF; color: #8A8A8A; font-size: 16px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      Пошук серед деталей для Q8
    </a>
  </header>

  <div style="background: #FFFFFF; padding: 12px 0 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06)">
    <div style="display: flex; gap: 8px; padding: 0 12px">
      <a href="ModelPicker-mobile.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 12px; border-radius: 10px; background: #C0092A; color: #FFFFFF; font-size: 14px; font-weight: 800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v4H3z"></path></svg>
        <span style="flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Audi Q8 (2018–2023)</span>
        <span role="button" aria-label="Прибрати модель" style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; font-size: 18px">×</span>
      </a>
      <a href="Home-filters.dc.html" style="position: relative; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFCF; color: #2E2E2E; font-size: 14px; font-weight: 800">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
        Фільтри
      </a>
    </div>
    <div style="display: flex; gap: 8px; padding: 0 12px; overflow: hidden">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <a href="#" style="{{c.style}}">{{c.name}}<span style="font-weight: 600; opacity: 0.75">{{c.n}}</span></a>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 12px 0; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 800; color: #2E2E2E">Запчастини Audi Q8 <span style="font-size: 14px; font-weight: 600; color: #6B6B6B">· [кількість]</span></h1>
      <a href="#" style="display: flex; align-items: center; min-height: 44px; color: #2E2E2E; font-size: 14px; font-weight: 700">Дорожчі ↓</a>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{cards}}" as="it" hint-placeholder-count="4">
        <dc-import name="Card" item="{{it}}" hint-size="100%,330px"></dc-import>
      </sc-for>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="TabBar" active="home" cart-count="{{one}}" hint-size="390px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = { stock: 'В наявності', stockColor: '#1E7B3C', model: 'Audi Q8 (2018–2023)' };
    const chip = 'flex: none; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; ';
    const list = [['Усі', ''], ['Кузовні частини', '[N]'], ['Оптика', '[N]'], ['Салон', '[N]'], ['Електроніка', '[N]']];
    return {
      one: 1,
      cats: list.map(([name, n], i) => ({ name, n, style: chip + (i === 0 ? 'background: #2E2E2E; color: #FFFFFF; font-weight: 800' : 'background: #F2F2F2; color: #2E2E2E; font-weight: 700') })),
      cards: [
        { ...ok, img: '/_blob/40297259a343bbf265474c29f9816d75', title: 'Комплект фар Matrix Q8', oe: '4M8941035', price: '$3 600' },
        { ...ok, img: '/_blob/f83dbeab6ac3a60c6257dbcefceffa63', title: 'Обвіс SQ8', oe: '4M8807065C GRU', price: '$3 500' },
        { ...ok, img: '/_blob/d46bd7087aa27aec7a252fbced241423', title: 'Фара ліва Matrix Q8 USA', oe: '4M8941035B', price: '$1 800' },
        { ...ok, img: '/_blob/d76dce9adcbd1d9c81947d2c3df4eb63', title: 'Фара права Matrix Q8 USA', oe: '4M8941036B', price: '$1 800' }
      ]
    };
  }
}
</script>
</body>
</html>
