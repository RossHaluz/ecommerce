<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Кошик — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <header style="height: 56px; background: #484848; display: flex; align-items: center; padding: 0 16px">
    <h1 style="margin: 0; color: #FFFFFF; font-size: 18px; font-weight: 800">Кошик · 2 товари</h1>
  </header>

  <div style="padding: 12px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="2">
      <article style="display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: #FFFFFF">
        <img src="{{it.img}}" alt="" style="width: 88px; height: 66px; object-fit: cover; border-radius: 8px; flex: none">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <a href="Main.dc.html" style="font-size: 14px; line-height: 18px; font-weight: 700; color: #2E2E2E">{{it.title}}</a>
          <span style="font-size: 12px; color: #6B6B6B">{{it.oe}} · 1 шт.</span>
          <span style="font-size: 16px; font-weight: 800; color: #2E2E2E">{{it.price}}</span>
        </div>
        <button aria-label="Видалити з кошика" style="width: 44px; height: 44px; border: 0; background: transparent; color: #6B6B6B; display: flex; align-items: center; justify-content: center; align-self: flex-start">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
        </button>
      </article>
    </sc-for>

    <section style="padding: 14px; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px; font-size: 15px">
      <div style="display: flex; justify-content: space-between"><span>Товари (2)</span><span>$3 530</span></div>
      <div style="display: flex; justify-content: space-between; color: #6B6B6B"><span>Доставка</span><span>за тарифами Нової пошти</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px solid #EEEEEE">
        <span style="font-weight: 800; color: #2E2E2E">Разом</span>
        <span style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 22px; font-weight: 800; color: #C0092A">$3 530</span><span style="font-size: 12px; color: #6B6B6B">≈ [сума] ₴</span></span>
      </div>
    </section>

    <a href="Checkout-mobile.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-size: 17px; font-weight: 800">Оформити замовлення</a>
    <a href="Oneclick-sheet.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 8px; border: 2px solid #C0092A; color: #C0092A; font-size: 16px; font-weight: 700">Замовити в 1 клік — лише телефон</a>

    <ul style="list-style: none; margin: 0; padding: 12px 14px; border-radius: 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 19px">
      <li style="display: flex; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#484848" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg><span><b>Обмін чи повернення</b> протягом 14 днів</span></li>
      <li style="display: flex; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#484848" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg><span><b>Онлайн через NovaPay</b> або при отриманні</span></li>
    </ul>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="TabBar" active="cart" cart-count="{{two}}" hint-size="390px,64px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      two: 2,
      items: [
        { img: '/_blob/75c7db32ffd1b6bba246b8fbaea94ecd', title: 'Обвіс SQ8 для Audi Q8 (2018–2023)', oe: '4M8807065C GRU', price: '$3 500' },
        { img: '/_blob/6dec74fe08a5b4b4c7192b6b70410247', title: 'Накладка дверки лівий зад', oe: '4M0854819E GRU', price: '$30' }
      ]
    };
  }
}
</script>
</body>
</html>
