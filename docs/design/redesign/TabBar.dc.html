<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Нижня панель вкладок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<nav aria-label="Основна навігація" style="width: 100%; height: 64px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #E4E4E4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); font-family: 'Mulish', sans-serif">
  <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
    <a href="#" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{tab.color}}; font-size: 11px; font-weight: {{tab.weight}}">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{tab.icon}}"></path></svg>
      {{tab.label}}
      <sc-if value="{{tab.badge}}" hint-placeholder-val="{{false}}">
        <span style="position: absolute; top: 6px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #C0092A; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box">{{tab.badge}}</span>
      </sc-if>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","catalog","car","cart","menu"],"default":"home"},"cartCount":{"editor":"int","default":1},"$preview":{"width":390,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const count = this.props.cartCount ?? 1;
    const defs = [
      { id: 'home', label: 'Головна', icon: 'M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z' },
      { id: 'catalog', label: 'Каталог', icon: 'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z' },
      { id: 'car', label: 'Моя Audi', icon: 'M3 13l2-5a2 2 0 0 1 1.9-1.3h10.2A2 2 0 0 1 19 8l2 5v4a1 1 0 0 1-1 1h-2M3 13v4a1 1 0 0 0 1 1h2M3 13h18M8 18h8' },
      { id: 'cart', label: 'Кошик', icon: 'M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 8H6.2M9 20h.01M17 20h.01' },
      { id: 'menu', label: 'Меню', icon: 'M4 7h16M4 12h16M4 17h16' }
    ];
    return {
      tabs: defs.map((t) => ({
        ...t,
        color: t.id === active ? '#C0092A' : '#6B6B6B',
        weight: t.id === active ? 800 : 600,
        badge: t.id === 'cart' && count > 0 ? String(count) : ''
      }))
    };
  }
}
</script>
</body>
</html>
