<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Моя Audi — вибір серії</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <div style="height: 116px; background: #484848"></div>
  <img src="/_blob/40297259a343bbf265474c29f9816d75" alt="" style="margin: 120px 12px 0; width: 175px; height: 131px; object-fit: cover; border-radius: 8px; display: block">
  <div style="position: absolute; inset: 0; background: rgba(20,20,20,0.6)"></div>
  <section role="dialog" aria-label="Оберіть свою Audi" style="position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: #FFFFFF; border-radius: 16px 16px 0 0; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D0D0D0"></div>
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; font-weight: 700; color: #6B6B6B">Крок 1 з 2</span>
        <h2 style="margin: 0; font-size: 22px; font-weight: 800; color: #2E2E2E">Оберіть модель Audi</h2>
      </div>
      <button aria-label="Закрити" style="width: 44px; height: 44px; border: 0; background: transparent; color: #484848; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid #CFCFCF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="Знайти модель" placeholder="Знайти модель, напр. Q7 4M" style="flex: 1; min-width: 0; border: 0; outline: none; font: inherit; font-size: 16px; background: transparent">
    </label>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{series}}" as="s" hint-placeholder-count="16">
        <a href="ModelPicker-step2.dc.html" style="{{s.style}}">{{s.name}}</a>
      </sc-for>
    </div>
    <a href="#" style="display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 14px; border-radius: 10px; background: #F2F2F2; color: #2E2E2E; font-weight: 700">
      Інші марки: VW, Porsche, Bentley…
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <p style="margin: 0; font-size: 13px; line-height: 18px; color: #6B6B6B; text-align: center">Не знаєте покоління? Перевіримо за VIN-кодом.</p>
      <a href="#" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 8px; border: 1px solid #484848; color: #2E2E2E; font-weight: 700">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 10h4M7 14h7"></path></svg>
        Підбір за VIN-кодом
      </a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = 'height: 56px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; ';
    const names = ['A1', 'A3', 'A4', 'A5', 'A6', 'A7', 'A8', 'Q2', 'Q3', 'Q4 e-tron', 'Q5', 'Q6 e-tron', 'Q7', 'Q8', 'e-tron', 'e-tron GT'];
    return {
      series: names.map((name) => ({
        name,
        style: base + (name === 'Q8' ? 'background: #C0092A; color: #FFFFFF' : 'background: #F2F2F2; color: #2E2E2E') + (name.length > 4 ? '; font-size: 13px' : '')
      }))
    };
  }
}
</script>
</body>
</html>
