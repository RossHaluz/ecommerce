<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Фільтри на головній — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <div style="height: 116px; background: #484848"></div>
  <div style="position: absolute; inset: 0; background: rgba(20,20,20,0.6)"></div>

  <form role="dialog" aria-label="Фільтри" style="position: absolute; left: 0; right: 0; bottom: 0; top: 48px; margin: 0; background: #FFFFFF; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 6px">
      <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D0D0D0"></div>
      <div style="display: flex; align-items: center">
        <h2 style="margin: 0; flex: 1; font-size: 20px; font-weight: 800; color: #2E2E2E">Фільтри</h2>
        <a href="Home-mobile.dc.html" aria-label="Закрити" style="width: 44px; height: 44px; color: #484848; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
      </div>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 18px">
      <fieldset style="margin: 0; padding: 0; border: 0">
        <legend style="padding: 0 0 8px; font-size: 15px; font-weight: 800; color: #2E2E2E">Модель</legend>
        <a href="ModelPicker-mobile.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 10px; background: #F6E6E9; color: #8F0720; font-weight: 800">
          <span style="flex: 1">Audi Q8 (2018–2023)</span>
          <span style="font-size: 14px; color: #C0092A">Змінити</span>
        </a>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 2px">
        <legend style="padding: 0 0 6px; font-size: 15px; font-weight: 800; color: #2E2E2E">Категорія</legend>
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <div style="display: flex; flex-direction: column">
            <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 15px; font-weight: {{c.weight}}; color: #2E2E2E">
              <input type="radio" name="hcat" checked="{{c.on}}" style="width: 20px; height: 20px; accent-color: #C0092A">
              <span style="flex: 1">{{c.name}}</span>
              <span style="font-size: 13px; color: #6B6B6B">{{c.n}}</span>
            </label>
            <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}">
              <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 0 8px 32px">
                <sc-for list="{{c.subs}}" as="s" hint-placeholder-count="3">
                  <span style="{{s.style}}">{{s.name}}</span>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
        <a href="AllCats-mobile.dc.html" style="display: flex; align-items: center; min-height: 40px; padding-left: 32px; color: #C0092A; font-size: 14px; font-weight: 800">Ще 10 категорій</a>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0">
        <legend style="padding: 0 0 8px; font-size: 15px; font-weight: 800; color: #2E2E2E">Наявність</legend>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <span style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #F2F2F2; font-size: 14px; font-weight: 700">Усі</span>
          <span style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #2E2E2E; color: #FFFFFF; font-size: 14px; font-weight: 800">В наявності</span>
          <span style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 10px; background: #F2F2F2; font-size: 13px; font-weight: 700; text-align: center">Під замовлення</span>
        </div>
      </fieldset>
    </div>

    <div style="padding: 12px 16px 16px; border-top: 1px solid #EEEEEE; display: flex; gap: 10px; background: #FFFFFF">
      <button type="button" style="height: 52px; padding: 0 18px; border: 1px solid #CFCFCF; border-radius: 8px; background: #FFFFFF; color: #2E2E2E; font: inherit; font-weight: 800">Скинути</button>
      <a href="Home-filtered.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-size: 16px; font-weight: 800">Показати [N] товарів</a>
    </div>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = 'display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 18px; font-size: 13px; ';
    const subs = (names, active) => names.map((name) => ({ name, style: chip + (name === active ? 'background: #2E2E2E; color: #FFFFFF; font-weight: 800' : 'background: #F2F2F2; color: #2E2E2E; font-weight: 700') }));
    const c = (name, on, list, active) => ({ name, on, n: '[N]', weight: on ? 800 : 600, subs: list ? subs(list, active) : [] });
    return {
      cats: [
        c('Усі категорії', false),
        c('Кузовні частини', false),
        c('Оптика', true, ['Уся оптика', 'Фари передні', 'Ліхтарі задні', 'Комплектуючі до фар'], 'Фари передні'),
        c('Інтер’єр салону', false),
        c('Електроніка', false),
        c('Система охолодження двигуна', false)
      ]
    };
  }
}
</script>
</body>
</html>
