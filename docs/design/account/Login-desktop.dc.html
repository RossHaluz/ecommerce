<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Вхід — комп'ютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C0092A}a:hover{color:#A30722}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <header style="height: 72px; background: #484848; display: flex; align-items: center; padding: 0 120px">
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em"><span style="color: #FFFFFF">Audi</span><span style="color: #F2364D">Parts</span></span>
  </header>
  <div style="position: absolute; inset: 0; background: rgba(20,20,20,0.55)"></div>

  <section role="dialog" aria-label="Вхід або реєстрація" style="position: absolute; left: 50%; top: 110px; margin-left: -240px; width: 480px; background: #FFFFFF; border-radius: 16px; box-shadow: 0 16px 48px rgba(0,0,0,0.25); padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 24px; font-weight: 800; color: #2E2E2E">Вхід або реєстрація</h2>
      <button aria-label="Закрити" style="width: 44px; height: 44px; margin-right: -12px; border: 0; background: transparent; color: #484848; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <span style="font-size: 15px; line-height: 21px">Обране на всіх пристроях, статус замовлень і номер ТТН, контакти підставляються при оформленні.</span>

    <button style="height: 52px; border: 1px solid #CFCFCF; border-radius: 10px; background: #FFFFFF; color: #2E2E2E; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
      <span aria-hidden="true" style="width: 20px; height: 20px; border-radius: 10px; border: 4px solid #4285F4; box-sizing: border-box; border-right-color: #34A853; border-bottom-color: #FBBC05; border-left-color: #EA4335"></span>
      Продовжити з Google
    </button>
    <button style="height: 52px; border: 0; border-radius: 10px; background: #000000; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px">
      <span aria-hidden="true" style="width: 18px; height: 20px; border-radius: 9px 9px 7px 7px; background: #FFFFFF"></span>
      Продовжити з Apple
    </button>

    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #6B6B6B">
      <span style="flex: 1; height: 1px; background: #E4E4E4"></span>або за номером телефону<span style="flex: 1; height: 1px; background: #E4E4E4"></span>
    </div>

    <form style="display: flex; gap: 10px; align-items: flex-end">
      <label style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #484848">Телефон
        <input type="tel" autocomplete="tel" placeholder="+380 000 00 00 00" style="height: 52px; border: 1px solid #CFCFCF; border-radius: 10px; padding: 0 14px; font: inherit; font-size: 17px; font-weight: 700; color: #2E2E2E">
      </label>
      <button style="height: 52px; padding: 0 18px; border: 0; border-radius: 10px; background: #C0092A; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800">Отримати код</button>
    </form>

    <p style="margin: 0; font-size: 12px; line-height: 17px; color: #6B6B6B">Продовжуючи, ви погоджуєтесь з <a href="#">умовами продажу</a> і <a href="#">політикою конфіденційності</a>. Купувати можна й без входу.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
