<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Пошук — підказки, комп'ютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C0092A}a:hover{color:#A30722}
</style>
</helmet>
<div style="width: 1440px; height: 820px; position: relative; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <div style="position: absolute; inset: 72px 0 0 0; background: rgba(20,20,20,0.45)"></div>
  <header style="position: relative; height: 72px; background: #484848; display: flex; align-items: center; gap: 16px; padding: 0 120px">
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em"><span style="color: #FFFFFF">Audi</span><span style="color: #F2364D">Parts</span></span>
    <span style="height: 44px; padding: 0 16px; border-radius: 8px; background: #5A5A5A; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center">Каталог</span>
    <label style="flex: 1; height: 44px; background: #FFFFFF; border-radius: 8px; border: 2px solid #C0092A; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input aria-label="Пошук" value="фара q8" style="border: 0; outline: none; font: inherit; font-size: 15px; font-weight: 700; width: 100%; color: #2E2E2E">
    </label>
    <span style="color: #FFFFFF; font-size: 15px; font-weight: 800">+38 (067) 383 42 83</span>
    <span style="width: 160px"></span>
  </header>

  <section role="listbox" aria-label="Підказки пошуку" style="position: absolute; left: 352px; top: 76px; width: 760px; background: #FFFFFF; border-radius: 12px; box-shadow: 0 16px 48px rgba(0,0,0,0.2); display: flex; flex-direction: column">
    <div style="display: grid; grid-template-columns: 260px minmax(0, 1fr)">
      <div style="padding: 16px; border-right: 1px solid #EEEEEE; display: flex; flex-direction: column; gap: 16px">
        <label style="min-height: 44px; border-radius: 10px; background: #FFF7F8; padding: 8px 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #2E2E2E">
          <input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #C0092A; margin: 0">
          <span>Лише для <b>Q8 (2018–2023)</b></span>
        </label>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 800; color: #6B6B6B; text-transform: uppercase; letter-spacing: 0.04em; padding-bottom: 4px">У категоріях</span>
          <a href="#" style="height: 36px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #2E2E2E; text-decoration: none">Оптика › Фари <span style="color: #6B6B6B">14</span></a>
          <a href="#" style="height: 36px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #2E2E2E; text-decoration: none">Протитуманні фари <span style="color: #6B6B6B">3</span></a>
          <a href="#" style="height: 36px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #2E2E2E; text-decoration: none">Задні ліхтарі <span style="color: #6B6B6B">6</span></a>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 800; color: #6B6B6B; text-transform: uppercase; letter-spacing: 0.04em; padding-bottom: 4px">Нещодавно</span>
          <a href="#" style="height: 32px; display: flex; align-items: center; font-size: 14px; color: #484848; text-decoration: none">обвіс sq8</a>
          <a href="#" style="height: 32px; display: flex; align-items: center; font-size: 14px; color: #484848; text-decoration: none">4M8807065C</a>
        </div>
      </div>
      <div style="padding: 12px 16px; display: flex; flex-direction: column">
        <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
          <a href="#" role="option" style="min-height: 72px; border-radius: 8px; padding: 6px 8px; display: flex; gap: 14px; align-items: center; text-decoration: none; {{p.bg}}">
            <span style="width: 80px; height: 60px; border-radius: 6px; background: #E4E4E4; flex: none"></span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-size: 15px; color: #2E2E2E"><b>{{p.match}}</b>{{p.rest}}</span>
              <span style="font-size: 13px; color: #6B6B6B">{{p.oe}} · <span style="color: {{p.stockColor}}; font-weight: 700">{{p.stock}}</span></span>
            </span>
            <span style="font-size: 17px; font-weight: 800; color: #C0092A; white-space: nowrap">{{p.price}}</span>
          </a>
        </sc-for>
      </div>
    </div>
    <a href="Search-results-desktop.dc.html" style="height: 52px; border-top: 1px solid #EEEEEE; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800; color: #C0092A; text-decoration: none">Показати всі 23 результати <span aria-hidden="true">→</span> <span style="font-weight: 400; color: #6B6B6B">або Enter</span></a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = '#008038', order = '#966400';
    const item = (match, rest, oe, inStock, price, active) => ({ match, rest, oe: 'OE ' + oe, price, stock: inStock ? 'в наявності' : 'під замовлення', stockColor: inStock ? ok : order, bg: active ? 'background: #F2F2F2' : '' });
    return {
      items: [
        item('Фара', ' права Matrix Q8 USA', '4M8941036B', true, '$1 800', true),
        item('Фара', ' ліва Matrix Q8', '4M8941035', true, '$1 950'),
        item('Комплект фар', ' Matrix Q8', '4M8941035', true, '$3 600'),
        item('Фара', ' протитуманна права Q8', '4M0941700', false, '$140')
      ]
    };
  }
}
</script>
</body>
</html>
