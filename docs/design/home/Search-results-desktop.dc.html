<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Пошук — результати, комп'ютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C0092A}a:hover{color:#A30722}
</style>
</helmet>
<div style="width: 1440px; height: 1100px; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <header style="height: 72px; background: #484848; display: flex; align-items: center; gap: 16px; padding: 0 120px">
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.01em"><span style="color: #FFFFFF">Audi</span><span style="color: #F2364D">Parts</span></span>
    <span style="height: 44px; padding: 0 16px; border-radius: 8px; background: #5A5A5A; color: #FFFFFF; font-size: 15px; font-weight: 800; display: flex; align-items: center">Каталог</span>
    <label style="flex: 1; height: 44px; background: #FFFFFF; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input aria-label="Пошук" value="фара q8" style="border: 0; outline: none; font: inherit; font-size: 15px; font-weight: 700; width: 100%; color: #2E2E2E">
    </label>
    <span style="color: #FFFFFF; font-size: 15px; font-weight: 800">+38 (067) 383 42 83</span>
    <span style="width: 160px"></span>
  </header>

  <div style="width: 1200px; margin: 0 auto; padding: 24px 0; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 24px; align-items: start">
    <aside style="display: flex; flex-direction: column; gap: 16px">
      <nav aria-label="Уточнити категорію" style="background: #FFFFFF; border-radius: 12px; padding: 8px">
        <span style="display: block; padding: 8px 12px; font-size: 13px; font-weight: 800; color: #6B6B6B; text-transform: uppercase; letter-spacing: 0.04em">Знайдено в</span>
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
          <a href="#" style="height: 40px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 15px; text-decoration: none; {{c.style}}"><span>{{c.label}}</span><span style="font-size: 13px; opacity: 0.75">{{c.count}}</span></a>
        </sc-for>
      </nav>
      <section style="background: #FFFFFF; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 16px; font-weight: 800; color: #2E2E2E">Не те, що шукали?</span>
        <span style="font-size: 14px; line-height: 19px">Надішліть фото деталі або VIN — знайдемо точну позицію.</span>
        <a href="#" style="height: 44px; border-radius: 8px; background: #5B47D6; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Написати у Viber</a>
        <a href="#" style="height: 44px; border-radius: 8px; background: #1E6FA8; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Написати в Telegram</a>
      </section>
    </aside>

    <main style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 800; color: #2E2E2E">23 результати за «фара q8»</h1>
          <div style="display: flex; gap: 8px">
            <button style="height: 32px; padding: 0 10px 0 12px; border-radius: 16px; border: 0; background: #2E2E2E; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 700">Лише Q8 (2018–2023) ×</button>
          </div>
        </div>
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6B6B6B">Спершу:
          <select style="height: 40px; border: 1px solid #CFCFCF; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 15px; font-weight: 700; color: #2E2E2E; background: #FFFFFF"><option>Найбільш схожі</option><option>Дешевші</option><option>Дорожчі</option><option>Нові надходження</option></select>
        </label>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{items}}" as="p" hint-placeholder-count="8">
          <article style="background: #FFFFFF; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px">
            <div style="position: relative; aspect-ratio: 4 / 3; border-radius: 8px; background: #E4E4E4">
              <button aria-label="Додати в обране" style="position: absolute; top: 6px; right: 6px; width: 40px; height: 40px; border: 0; border-radius: 20px; background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center; color: #6B6B6B">
                <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
              </button>
            </div>
            <a href="#" style="font-size: 15px; color: #2E2E2E; line-height: 20px; text-decoration: none; height: 40px; overflow: hidden"><b>{{p.match}}</b>{{p.rest}}</a>
            <span style="font-size: 13px; color: #6B6B6B">{{p.oe}}</span>
            <span style="font-size: 13px; font-weight: 700; color: {{p.stockColor}}">{{p.stock}}</span>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-top: 2px">
              <span style="font-size: 19px; font-weight: 800; color: #C0092A">{{p.price}}</span>
              <button style="height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #C0092A; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 800">Купити</button>
            </div>
          </article>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = '#008038', order = '#966400';
    const item = (match, rest, oe, inStock, price) => ({ match, rest, oe: 'OE ' + oe, price, stock: inStock ? 'В наявності' : 'Під замовлення', stockColor: inStock ? ok : order });
    const on = 'background: #2E2E2E; color: #FFFFFF; font-weight: 800', off = 'color: #2E2E2E';
    return {
      cats: [{ label: 'Усі результати', count: '23', style: on }, { label: 'Фари', count: '14', style: off }, { label: 'Протитуманні фари', count: '3', style: off }, { label: 'Задні ліхтарі', count: '6', style: off }],
      items: [
        item('Фара', ' права Matrix Q8 USA', '4M8941036B', true, '$1 800'),
        item('Фара', ' ліва Matrix Q8', '4M8941035', true, '$1 950'),
        item('Комплект фар', ' Matrix Q8', '4M8941035', true, '$3 600'),
        item('Фара', ' протитуманна права Q8', '4M0941700', false, '$140'),
        item('Фара', ' права LED Q8', '4M8941034', true, '$1 400'),
        item('Фара', ' ліва LED Q8, під ремонт', '4M8941033', true, '$600'),
        item('Фара', ' протитуманна ліва Q8', '4M0941699', true, '$140'),
        item('Ліхтар', ' правий Q8 (поруч із фарами)', '4M8945092', true, '$3 000')
      ]
    };
  }
}
</script>
</body>
</html>
