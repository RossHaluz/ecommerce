<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Футер — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E4E4E4}a:hover{color:#FFFFFF}
</style>
</helmet>
<footer style="width: 390px; height: 1000px; background: #2E2E2E; font-family: 'Mulish', sans-serif; color: #D0D0D0; display: flex; flex-direction: column; box-sizing: border-box; padding-bottom: 64px">
  <div style="background: #3A3A3A; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 18px; font-weight: 800; color: #FFFFFF">Не знайшли потрібну деталь?</span>
    <span style="font-size: 14px; line-height: 19px">Надішліть VIN або фото — підберемо й зателефонуємо з ціною.</span>
    <a href="#" style="height: 48px; border-radius: 8px; background: #FFFFFF; color: #2E2E2E; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Подзвонити · +38 (067) 383 42 83</a>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="#" style="height: 44px; border-radius: 8px; background: #5B47D6; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Viber</a>
      <a href="#" style="height: 44px; border-radius: 8px; background: #1E6FA8; color: #FFFFFF; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Telegram</a>
    </div>
  </div>

  <div style="padding: 8px 16px; display: flex; flex-direction: column">
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
      <div style="border-bottom: 1px solid #444444">
        <button aria-expanded="{{s.open}}" style="width: 100%; height: 52px; border: 0; background: transparent; display: flex; align-items: center; justify-content: space-between; font: inherit; font-size: 16px; font-weight: 800; color: #FFFFFF; padding: 0">{{s.title}} <span aria-hidden="true" style="font-size: 20px">{{s.sign}}</span></button>
        <sc-if value="{{s.open}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-direction: column; padding-bottom: 8px">
            <sc-for list="{{s.links}}" as="l" hint-placeholder-count="5">
              <a href="#" style="height: 40px; display: flex; align-items: center; font-size: 15px; text-decoration: none">{{l}}</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 20px">
    <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.01em"><span style="color: #FFFFFF">Audi</span><span style="color: #F2364D">Parts</span></span>
    <span>м. Хмельницький, вул. Молодіжна, 15/1<br>Пн–Пт 10:00–19:00, Сб–Нд — вихідний</span>
    <a href="mailto:audipartshm@gmail.com" style="text-decoration: none">audipartshm@gmail.com</a>
  </div>

  <div style="margin-top: auto; border-top: 1px solid #444444; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 13px">
    <span>© 2026 Audiparts</span>
    <span><b style="color: #FFFFFF">UK</b> · PL · <b style="color: #FFFFFF">$</b> · ₴</span>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const s = (title, links, open) => ({ title, links, open: !!open, sign: open ? '−' : '+' });
    return {
      sections: [
        s('Каталог', ['Кузовні частини', 'Оптика', 'Ходова частина', 'Двигун + АКПП', 'Усі 16 категорій →'], true),
        s('Популярні моделі', ['Audi Q7 4M', 'Audi Q8', 'Audi A6 C8']),
        s('Покупцям', ['Доставка й оплата', 'Обмін і повернення', 'Контакти'])
      ]
    };
  }
}
</script>
</body>
</html>
