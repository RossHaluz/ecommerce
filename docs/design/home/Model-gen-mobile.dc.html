<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Оберіть Audi — покоління</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C0092A}a:hover{color:#A30722}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <div style="position: absolute; inset: 0; background: rgba(20,20,20,0.55)"></div>
  <section role="dialog" aria-label="Оберіть покоління Q7" style="position: absolute; left: 0; right: 0; bottom: 0; height: 780px; background: #FFFFFF; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 2px; background: #D0D0D0"></span></div>
    <div style="display: flex; align-items: center; gap: 4px; padding: 4px 8px 0 4px">
      <a href="Model-series-mobile.dc.html" aria-label="Назад до серій" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2E2E2E">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="flex: 1; display: flex; flex-direction: column">
        <span style="font-size: 12px; font-weight: 700; color: #6B6B6B">Крок 2 з 2 · Audi Q7</span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 800; color: #2E2E2E">Рік випуску</h2>
      </div>
      <button aria-label="Закрити" style="width: 44px; height: 44px; border: 0; background: transparent; color: #484848; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{gens}}" as="g" hint-placeholder-count="5">
        <a href="Main.dc.html" style="min-height: 64px; border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; text-decoration: none; {{g.style}}">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 800; color: #2E2E2E">{{g.name}}</span>
            <span style="font-size: 13px; color: #6B6B6B">{{g.hint}}</span>
          </span>
          <span style="font-size: 13px; font-weight: 700; color: #484848; white-space: nowrap">{{g.count}}</span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
      </sc-for>
      <p style="margin: 4px 0 0; font-size: 13px; line-height: 18px; color: #6B6B6B">Не впевнені в поколінні? Рік є в техпаспорті (п. B), а точну відповідність перевіримо за VIN.</p>
    </div>

    <div style="padding: 12px 16px 20px; border-top: 1px solid #EEEEEE">
      <a href="Main.dc.html" style="height: 48px; border-radius: 8px; border: 2px solid #C0092A; box-sizing: border-box; color: #C0092A; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Усі Q7 — без вибору року</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const off = 'background: #F7F7F7', on = 'background: #FFF7F8; border: 2px solid #C0092A';
    const g = (name, hint, count, selected) => ({ name, hint, count, style: selected ? on : off });
    return {
      gens: [
        g('Q7 4M (2024–)', 'Другий рестайлінг', '[N] деталей'),
        g('Q7 4M (2020–2024)', 'Рестайлінг', '[N] деталей', true),
        g('Q7 4M (2015–2019)', 'Друге покоління', '[N] деталей'),
        g('Q7 4L (2010–2015)', 'Рестайлінг першого', '[N] деталей'),
        g('Q7 4L (2005–2010)', 'Перше покоління', '[N] деталей')
      ]
    };
  }
}
</script>
</body>
</html>
