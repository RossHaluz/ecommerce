<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Сортування й фільтри — телефон</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C0092A}a:hover{color:#A30722}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <div style="position: absolute; inset: 0; background: rgba(20,20,20,0.55)"></div>
  <section role="dialog" aria-label="Сортування й фільтри" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: #FFFFFF; border-radius: 16px 16px 0 0; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 4px; border-radius: 2px; background: #D0D0D0"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 16px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 800; color: #2E2E2E">Сортування й фільтри</h2>
      <button aria-label="Закрити" style="width: 44px; height: 44px; border: 0; background: transparent; color: #484848; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 20px">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
        <legend style="font-size: 15px; font-weight: 800; color: #2E2E2E; padding: 0 0 6px">Спершу показувати</legend>
        <sc-for list="{{sorts}}" as="s" hint-placeholder-count="3">
          <label style="height: 48px; display: flex; align-items: center; gap: 12px; font-size: 16px; color: #2E2E2E">
            <input type="radio" name="sort" checked="{{s.on}}" style="width: 20px; height: 20px; accent-color: #C0092A; margin: 0">
            {{s.label}}
          </label>
        </sc-for>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px">
        <legend style="font-size: 15px; font-weight: 800; color: #2E2E2E; padding: 0 0 6px">Наявність</legend>
        <label style="height: 48px; display: flex; align-items: center; gap: 12px; font-size: 16px; color: #2E2E2E">
          <input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #C0092A; margin: 0">
          В наявності — відправимо одразу <span style="margin-left: auto; color: #6B6B6B; font-size: 14px">186</span>
        </label>
        <label style="height: 48px; display: flex; align-items: center; gap: 12px; font-size: 16px; color: #2E2E2E">
          <input type="checkbox" style="width: 20px; height: 20px; accent-color: #C0092A; margin: 0">
          Під замовлення <span style="margin-left: auto; color: #6B6B6B; font-size: 14px">126</span>
        </label>
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 15px; font-weight: 800; color: #2E2E2E; padding: 0 0 6px">Ціна, $</legend>
        <div style="display: flex; align-items: center; gap: 10px">
          <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #6B6B6B">від
            <input inputmode="numeric" placeholder="2" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 16px; color: #2E2E2E">
          </label>
          <span style="padding-top: 18px">—</span>
          <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #6B6B6B">до
            <input inputmode="numeric" placeholder="3 600" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 8px; padding: 0 12px; font: inherit; font-size: 16px; color: #2E2E2E">
          </label>
        </div>
      </fieldset>
    </div>

    <div style="padding: 12px 16px 20px; border-top: 1px solid #EEEEEE; display: flex; gap: 10px">
      <button style="height: 52px; padding: 0 18px; border-radius: 8px; border: 1px solid #CFCFCF; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 800; color: #2E2E2E">Скинути</button>
      <a href="Main.dc.html" style="flex: 1; height: 52px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Показати 186 деталей</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sorts: [
        { label: 'Нові надходження', on: true },
        { label: 'Дешевші', on: false },
        { label: 'Дорожчі', on: false }
      ]
    };
  }
}
</script>
</body>
</html>
