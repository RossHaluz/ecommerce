<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Модалка кошика — комп'ютер</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C0092A}a:hover{color:#A30722}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #F2F2F2; font-family: 'Mulish', sans-serif; color: #484848">
  <header style="height: 72px; background: #484848; display: flex; align-items: center; padding: 0 120px">
    <span style="color: #FFFFFF; font-size: 22px; font-weight: 800; letter-spacing: 0.04em">[ЛОГОТИП]</span>
  </header>
  <div style="position: absolute; inset: 0; background: rgba(20,20,20,0.55)"></div>

  <aside role="dialog" aria-label="Кошик" style="position: absolute; top: 0; right: 0; bottom: 0; width: 440px; background: #FFFFFF; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 12px 12px 24px; border-bottom: 1px solid #EEEEEE">
      <h2 style="margin: 0; font-size: 20px; font-weight: 800; color: #2E2E2E">Кошик · 3 товари</h2>
      <button aria-label="Закрити" style="width: 44px; height: 44px; border: 0; background: transparent; color: #484848; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 0 24px; display: flex; flex-direction: column">
      <sc-for list="{{items}}" as="item" hint-placeholder-count="3">
        <div style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid #EEEEEE">
          <div style="width: 80px; height: 60px; border-radius: 8px; background: #E4E4E4; flex: none"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; justify-content: space-between; gap: 8px">
              <a href="#" style="font-size: 14px; font-weight: 700; color: #2E2E2E; text-decoration: none; line-height: 18px">{{item.title}}</a>
              <span style="font-size: 16px; font-weight: 800; color: #2E2E2E; white-space: nowrap">{{item.sum}}</span>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between">
              <div style="display: flex; align-items: center; border: 1px solid #CFCFCF; border-radius: 8px; height: 40px">
                <button aria-label="Менше" style="width: 40px; height: 38px; border: 0; background: transparent; font-size: 20px; color: {{item.minusColor}}">−</button>
                <span style="min-width: 24px; text-align: center; font-size: 15px; font-weight: 800; color: #2E2E2E">{{item.qty}}</span>
                <button aria-label="Більше" style="width: 40px; height: 38px; border: 0; background: transparent; font-size: 20px; color: {{item.plusColor}}">+</button>
              </div>
              <button aria-label="Видалити з кошика" style="width: 44px; height: 44px; border: 0; background: transparent; color: #6B6B6B; display: flex; align-items: center; justify-content: center">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
              </button>
            </div>
            <sc-if value="{{item.hint}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; font-weight: 700; color: #6B6B6B">Остання 1 шт. — більше додати не можна</span>
            </sc-if>
          </div>
        </div>
      </sc-for>

      <div style="display: flex; flex-direction: column; gap: 10px; padding-top: 16px">
        <span style="font-size: 15px; font-weight: 800; color: #2E2E2E">Можливо, вас зацікавлять</span>
        <sc-for list="{{similar}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; gap: 12px; align-items: center">
            <div style="width: 56px; height: 42px; border-radius: 6px; background: #E4E4E4; flex: none"></div>
            <a href="#" style="flex: 1; min-width: 0; font-size: 13px; font-weight: 700; color: #2E2E2E; text-decoration: none">{{s.title}}</a>
            <span style="font-size: 14px; font-weight: 800; color: #C0092A; white-space: nowrap">{{s.price}}</span>
            <button aria-label="Додати в кошик" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: #F2F2F2; color: #C0092A; display: flex; align-items: center; justify-content: center; flex: none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="padding: 16px 24px 24px; border-top: 1px solid #EEEEEE; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 15px; font-weight: 800; color: #2E2E2E">Разом</span>
        <span style="display: flex; flex-direction: column; align-items: flex-end">
          <span style="font-size: 24px; font-weight: 800; color: #C0092A">$3 590</span>
          <span style="font-size: 12px; color: #6B6B6B">≈ [сума] ₴ · доставка за тарифами НП</span>
        </span>
      </div>
      <a href="#" style="height: 52px; border-radius: 8px; background: #C0092A; color: #FFFFFF; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; text-decoration: none">Оформити замовлення</a>
      <a href="Cart-desktop.dc.html" style="height: 40px; color: #484848; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">Відкрити кошик повністю</a>
    </div>
  </aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const gray = '#2E2E2E', off = '#C4C4C4';
    return {
      items: [
        { title: 'Обвіс SQ8 для Audi Q8 (2018–2023)', sum: '$3 500', qty: 1, minusColor: off, plusColor: off, hint: true },
        { title: 'Накладка дверки лівий зад', sum: '$60', qty: 2, minusColor: gray, plusColor: gray, hint: false },
        { title: 'Решітка бампера права під радар', sum: '$30', qty: 1, minusColor: off, plusColor: off, hint: true }
      ],
      similar: [
        { title: 'Заглушка дверки', price: '$2' },
        { title: 'Капот Q8', price: '$1 300' },
        { title: 'Дзеркало ліве Q8, 15 pin + камера', price: 'Договірна' }
      ]
    };
  }
}
</script>
</body>
</html>
